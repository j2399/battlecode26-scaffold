# What are you trying to run?

teamA=econ5
teamB=econ5
languageA=java
languageB=java
maps=trainingmap6
params=50

# Bumped from Gradle's default daemon heap after compileJava started
# crashing with "JVM garbage collector is thrashing" -- src/ has
# accumulated ~450 packages over the course of this project's RL
# training runs, roughly 100 of which hold the large 3-layer teacher
# NeuralNet.java export (~50k generated lines each, see rl_train.py's
# export_teacher_neuralnet_java), and a full recompile of all of that
# together was exceeding the default heap. Later grew past 450 packages
# (417 dirs / 4439 .java files measured directly) to where even 4g
# wasn't enough: a cold compile ran 1h32m and then crashed with
# "OutOfMemoryError: Java heap space" inside Gradle's *native file
# watcher* (NativeFileWatcher.executeRunLoop), not the compiler itself
# -- watching that many files/packages for changes exhausted heap on
# its own. Bumped to 6g and disabled VFS watching (below) since nothing
# here benefits from watching thousands of auto-generated, rarely-
# reopened checkpoint packages for live edits.
org.gradle.jvmargs=-Xmx6g

# See the comment above -- the native file watcher itself was the actual
# OOM site on this repo's checkpoint-inflated src/ tree, independent of
# the compiler's own heap use.
org.gradle.vfs.watch=false

# Some optional configurations you can adjust as you need

debug=false
outputVerbose=true
showIndicators=true
validateMaps=true
alternateOrder=false
compatibilityClient=false
